V.guide = () => head("User guide", `Version ${APP_VERSION}. How to set up, update and read the model.`) + `<div class="panel doc">
  <h3>1. Access and requirements</h3><p>Open the platform link in any current browser (Chrome, Edge, Safari, Firefox), or open the file <code>valuation_platform.html</code> locally. No installation, account or subscription is needed. An internet connection is needed only for the web fonts and for Excel/PDF import-export (SheetJS and jsPDF load from cdnjs); all valuation calculations run offline in the browser. Data are entered manually or by file upload; there is no live price feed. To make this quick, Market & company, Financial history and Peer data carry links that open the matching pages for the current ticker (Yahoo Finance quote, statistics, income statement, balance sheet, cash flow; for IDX companies also the IDX company profile, IDX financial reports and Stockbit), a company search, and the list of all IDX-listed companies. Each input says where its value is found. A browser page cannot download data from these sites itself (they block it), so the values are copied or imported with the data template.</p>
  <h3>1a. Data connector: fetch data from IDX and Yahoo with one click</h3><p>A web page may not load data from idx.co.id or Yahoo Finance itself, but a program on your own computer may. <code>data_connector.py</code> is that program: it runs locally (only reachable from your computer at 127.0.0.1:8765), fetches the data in Python and hands it to the platform.</p>
  <ol class="plain"><li>Once, in Terminal: <code>pip3 install yfinance openpyxl pandas curl_cffi tabulate</code>. For audited IDX filings also: <code>git clone https://github.com/celeebi/IDX_GetFinancialStatement</code> into the platform folder (open-source package by celeebi, MIT licence).</li>
  <li>Start: <code>python3 data_connector.py</code> (finds the IDX package automatically in the same folder, or use <code>--idx-repo &lt;folder&gt;</code>). Keep the window open.</li>
  <li>Open <code>valuation_platform.html</code> → Market & company → <i>Fetch data automatically</i>: the status shows <i>Connected</i>. Search a company by name or ticker (IDX company list and Yahoo search), click <i>Value this company</i>, add peers with <i>Add as peer</i>, choose the source of the statements (IDX audited filings or Yahoo) and click <i>Fetch data and recalculate</i>.</li></ol>
  <p>What is filled: company name, currency, share price on the valuation date, shares outstanding, regression beta, three fiscal years of statements, all peer data. Statements from IDX come from the audited XBRL filings; any line the filing lacks (e.g. EPS, lease liabilities, asset-sale proceeds, non-controlling interests) is taken from Yahoo, and a list shows the source of every line. Suggested, applied only when you tick them: equity risk premium and statutory tax rate of the country (Damodaran country risk premiums), unlevered beta corrected for cash of the chosen industry in the company's region (Damodaran betas by sector; the industry is pre-selected from Yahoo's classification and can be changed), debt spread from the synthetic rating implied by interest cover (EBIT ÷ interest expense, Damodaran rating table), and for US-dollar companies the 10-year Treasury yield as risk-free rate. The risk-free rate in other currencies is entered by hand (10-year government bond yield). On Forecast & scenarios, <i>Suggest from history</i> derives starting drivers (last revenue growth fading to terminal growth, two-year EBITDA margin, D&A share, marginal sales-to-capital, Bear/Bull spreads) – shown with their derivation and applied only on click. Peer flags you set (audited, close model) are kept. When you switch to another company, lines the source does not deliver are cleared and highlighted, so no number of the previous company survives. The online link cannot reach your computer; use the offline file. The IDX package works around IDX's bot protection and Yahoo is unofficial, so both can stop working without notice; the manual links and the data template remain as fallback.</p>
  <h3>1b. Automatic retrieval from Yahoo Finance into an Excel file</h3><p>The package contains <code>fetch_yahoo.py</code>. It retrieves the share price on the valuation date, shares outstanding, regression beta, effective tax rate, three fiscal years of income statement, balance sheet and cash flow, and the peer data (price, shares, EPS, book value per share, growth, debt, cash, EV/EBITDA), converts them to million units and writes an Excel file in the platform's import format.</p>
  <ol class="plain"><li>Once: install Python 3, then in Terminal <code>pip3 install yfinance openpyxl</code>.</li>
  <li>In the folder with the script: <code>python3 fetch_yahoo.py BIRD --exchange IDX --peers WEHA LRNA BPTR JAYA --date 2026-10-23</code> (any ticker and exchange, e.g. <code>AAPL --exchange NASDAQ --peers MSFT GOOGL</code>).</li>
  <li>Import & export → <i>Import file</i> → choose the written <code>…_yahoo_import_….xlsx</code>. Everything recalculates.</li></ol>
  <p>Not on Yahoo and therefore kept as they are: risk-free rate, equity risk premium, unlevered beta, debt spread and the forecast assumptions. Lines Yahoo does not report are not written, so existing values stay. The Notes sheet and the terminal list every gap. Yahoo figures are unaudited aggregations: check revenue, EBIT, net income and debt against the annual report on IDX. The script needs internet access; Yahoo is free but may limit or change its interface without notice.</p>
  <h3>2. Layout</h3><p><b>Results</b> (dashboard, recommendation) → <b>Inputs</b> (market, financial history, peers, forecast & scenarios, decision rules) → <b>Valuation</b> (market value, DCF, relative, method selection, sensitivity) → <b>Control</b> (checks, import/export, this guide). Inputs, assumptions, calculation logic and outputs are separated: inputs are only edited on Input views; every other view is calculated.</p>
  <h3>3. Updating the model</h3><ol class="plain"><li><b>Another company:</b> Import & export → <i>Start a new company</i> (blank dataset), then fill Market & company (name, ticker, currency), Financial history, Peer data and Forecast & scenarios, or import a filled data template. The highlighted missing inputs work as a checklist; the model runs as soon as they are complete. <i>Load example</i> brings back the Blue Bird case.</li>
  <li><b>New share price:</b> Market & company → Share price and Price date; set the Valuation date. Peer prices on Peer data.</li>
  <li><b>New annual report:</b> Financial history → <i>Roll forward one year</i> (drops the oldest year, opens an empty column), then type or import the new figures. Missing cells are highlighted and the recommendation pauses until they are filled.</li>
  <li><b>Bulk update:</b> Import & export → download the data template, edit in Excel, import. JSON datasets restore a complete saved state.</li>
  <li><b>Assumptions:</b> Forecast & scenarios (drivers per scenario and year) and Decision rules (thresholds).</li>
  <li>Every change recalculates all views, scenarios, checks and the recommendation instantly; <i>Recalculate</i> forces a full run. Each input section carries a last-updated timestamp, and the update log records changes.</li></ol>
  <h3>4. Units and conventions</h3><p>Money in million of the dataset currency (Market & company → Currency); per-share values in that currency; shares in million. Percentages are typed as percent (7.2 = 7.2%). Thousands separators are allowed in number fields. Fiscal year = calendar year.</p>
  <h3>5. Calculations</h3><div class="formula">WACC     = E/(D+E)·[Rf + βL·ERP] + D/(D+E)·(Rf + spread)·(1−t),  βL = βu·(1 + (1−t)·D/E)
FCFF_t   = Revenue_t·(EBITDA% − D&A%)·(1−t) − (Revenue_t − Revenue_t−1) / sales-to-capital
TV       = NOPAT_T·(1+g)·(1 − g/RONIC) / (WACC − g),  RONIC = WACC + premium
Equity   = Σ PV(FCFF) + PV(TV) − debt + cash − NCI;   value/share = equity / shares
Relative = Σ w_k · (peer median multiple_k × company metric_k),  w_k ∝ usable peers
Blended  = w_DCF · DCF + w_REL · Relative,  weights from the method selector
Signal   = BUY if upside ≥ 15%, SELL if ≤ −15%, else HOLD (editable)</div>
  <h3>6. Outputs</h3><p>Dashboard: recommendation and conviction, central estimate (Base, blended), fair-value range (Bear to Bull, blended), market price, implied upside, method values and weights, decision criteria, checks, risks. Exports: PDF summary, full results workbook, CSV, HTML report page and the dataset.</p>
  <h3>7. Known limitations</h3><ul class="plain"><li>Three fiscal years of history; D&A, capex, debt and working capital are needed for the latest two.</li><li>Peer quality decides the weight of multiples; in the Blue Bird example the peer set is small, one peer is unaudited and EV/EBITDA rests on one peer.</li><li>No live market-data connection; prices must be refreshed by hand or by file.</li><li>One currency per dataset, annual periods only; FCFF DCF is not suited to banks (the profile switch sets its weight to zero).</li><li>Drafts are stored only in the current browser; use the dataset export to keep them.</li></ul></div>`;

V.about = () => head("Method & AI disclosure", "What the engine does, how it was checked, and how AI was used.") + `<div class="grid g2">
  <div class="panel doc"><h3>Calculation engine</h3><p>The platform runs its own JavaScript valuation engine (pure functions, no server). An independent Python implementation of the same rules (<code>engine_ref.py</code>) serves as the reference. Before release both engines were run on the original dataset (538 outputs compared, 0 differences beyond 1e-9) and on 25 randomly perturbed datasets (prices, betas, tax, margins, sales-to-capital, a financial-firm flag, stale prices, invalid terminal growth): all agreed. The <a href="#checks">self-test</a> repeats the comparison in your browser.</p>
  <h3>Data sources of the example dataset (PT Blue Bird Tbk)</h3><p class="small muted">The engine is company-agnostic; these sources belong to the worked example. A new dataset carries its own source notes under each input.</p><ul class="plain small"><li>Financial statements: PT Blue Bird Tbk Annual & Sustainability Report 2025 (audited consolidated statements; Notes 10, 14, 19, 22, 23).</li><li>Prices: Ajaib / akufrugal.com quotes, 23 Oct 2026.</li><li>Rf: BRIDS Daily Fixed Income Update (INDOGB 10Y, 6 Oct 2026). ERP and sector beta: Damodaran, January 2026.</li><li>Peers: FY2025 annual reports of LRNA, BPTR, JAYA; WEHA from stockanalysis.com.</li><li>Consensus: MarketScreener (3 analysts), accessed 17 Oct 2026.</li></ul></div>
  <div class="panel doc"><h3>AI disclosure</h3><p><b>Tool used:</b> Claude (Anthropic), through the Claude app.</p>
  <p><b>Tasks supported:</b> locating and extracting figures from the 410-page annual report; writing the JavaScript engine, the Python reference engine and this interface; drafting the method-selection rules, checks and documentation for review.</p>
  <p><b>How outputs were checked:</b> every input figure traced to a note or page of the annual report and re-added (A = L + E and EPS = profit ÷ shares are tested automatically); cross-engine test (JavaScript vs Python) on 538 outputs and 25 perturbed datasets; spot checks by hand (EBITDA = EBIT + D&A = 687 + 651 = IDR 1,339bn; WACC build-up); validation checks C01–C17 run on every recalculation.</p>
  <p><b>Corrections made:</b> an earlier version backed BIRD's EBITDA out of an assumed multiple (IDR 1,243bn); it was replaced by the reported figure (IDR 1,339bn). Share and peer prices were refreshed from late September to 23 October 2026. A formatting error in the earlier P/E range output was removed.</p>
  <p><b>Limitations:</b> AI drafted code and text; the author is responsible for every assumption, source and conclusion and has reviewed the calculation logic. Forecast drivers and decision thresholds are judgments, shown as editable inputs.</p></div></div>`;

function rollForward(){
  const f = D.financials, last = f.years[f.years.length-1], next = String((parseInt(last,10)||0)+1);
  for (const k of Object.keys(f)) { if (Array.isArray(f[k]) && k !== "years") { f[k].shift(); f[k].push(null); } }
  f.years.shift(); f.years.push(next); touch("financials"); logUpdate("financials","roll forward",`now ${f.years.join(", ")}`);
  recalc(); toast(`Rolled forward to ${f.years.join(", ")}. Fill in FY${next}; the recommendation pauses until required cells are complete.`);
}

function importFile(file){

  rd.onerror = () => report(false, "The file could not be read.");
  rd.onload = () => {
    try {
      const before = JSON.stringify(D); let notes = [], n = 0;
      if (name.endsWith(".json")) { const d = JSON.parse(rd.result); for (const k of ["meta","market","financials","peers","assumptions","profile"]) if (!d[k]) throw new Error(`missing section “${k}”`);
        D = d; D.meta.lastUpdated = D.meta.lastUpdated || {}; notes.push("Complete dataset replaced."); n = 1; logUpdate("all","import JSON",file.name); }
      else if (name.endsWith(".csv")) { n = importCSV(rd.result, notes); logUpdate("import","import CSV",`${file.name}: ${n} values`); }
      else if (name.endsWith(".xlsx")) { if (!window.XLSX) throw new Error("Excel library not loaded (needs internet)"); n = importBook(window.XLSX.read(new Uint8Array(rd.result), {type:"array"}), notes); logUpdate("import","import XLSX",`${file.name}: ${n} values`); }
      else throw new Error("unsupported file type");
      if (JSON.stringify(D) === before && n) notes.push("No values changed (file matches the current data).");
      recalc(); report(true, `Imported ${file.name}: ${n} value(s) read. ${missing.length ? missing.length+" required input(s) still missing." : "All required inputs present."}`, notes);
    } catch(e) { report(false, `Import failed: ${e.message}. Nothing was changed.`); }
  };
  if (name.endsWith(".xlsx")) rd.readAsArrayBuffer(file); else rd.readAsText(file);
}

    if (["rf","erp","tax","kdSpread","buy","sell","agreeHigh","agreeLow","reverseTol","capexHeavy","maxG","ronicPremium"].includes(k) && isNum(x) && Math.abs(x) > 1) notes.push(`${k} = ${x} looks like a percent; rates must be decimals (0.07 = 7%). Value not imported.`);
    else { target[k] = x; n++; } }

  d.profile = {industry:"", businessModel:"", isFinancial:false, auditedFS:true, guidance:false};
  for (const k of Object.keys(d.market)) d.market[k] = null;
  d.market.priceDate = today;
  d.marketSources = {}; d.assumptionSources = {};
  const n = d.financials.years.length, y0 = new Date().getFullYear() - 1;
  d.financials.years = Array.from({length:n}, (_, i) => String(y0 - n + 1 + i));
  for (const k of Object.keys(d.financials)) if (Array.isArray(d.financials[k]) && k !== "years") d.financials[k] = nul(n);
  d.financials.source = "";
  d.peers = [{ticker:"PEER1",name:"",price:null,priceDate:today,sharesMn:null,eps:null,bvps:null,revGrowth:null,niGrowth:null,debt:null,cash:null,evEbitda:null,audited:true,closeModel:true,source:""}];
  d.assumptions.forecastYears = Array.from({length:5}, (_, i) => String(y0 + 1 + i));
  for (const s of Object.values(d.assumptions.scenarios)) { s.growth = nul(5); s.ebitdaMargin = nul(5); s.daPct = nul(5); s.s2c = nul(5); }
  return d;
}

  const h = (location.hash || "").slice(1); view = V[h] ? h : "dashboard";

})();
