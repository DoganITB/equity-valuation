<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Equity Valuation Platform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar with the live verdict, left rail of views, one working view at a time.
   Concept: an analyst's valuation desk - ledger tables, meter-style figures, units from the dataset. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#eaeef2; --ink:#14202c; --ink-2:#465564; --ink-3:#6f7d8b;
  --line:#d6dde4; --line-2:#e6ebef; --accent:#0d5c8a; --accent-2:#e3eef6; --accent-ink:#ffffff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#1b7a3d; --good-bg:#e3f3e8; --warn:#9a6300; --warn-bg:#fbf0d9; --bad:#b8352d; --bad-bg:#f9e2df;
  --shadow:0 1px 2px rgba(20,32,44,.06),0 2px 8px rgba(20,32,44,.05);
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141a; --surface:#151d25; --surface-2:#1c2630; --ink:#e6ecf1; --ink-2:#a8b5c1; --ink-3:#7f8d99;
  --line:#2b3743; --line-2:#222d38; --accent:#5aa8da; --accent-2:#18303f; --accent-ink:#0e141a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#5cc386; --good-bg:#16301f; --warn:#e0a640; --warn-bg:#33270f; --bad:#ef7a70; --bad-bg:#3a1b19;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141a; --surface:#151d25; --surface-2:#1c2630; --ink:#e6ecf1; --ink-2:#a8b5c1; --ink-3:#7f8d99;
  --line:#2b3743; --line-2:#222d38; --accent:#5aa8da; --accent-2:#18303f; --accent-ink:#0e141a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#5cc386; --good-bg:#16301f; --warn:#e0a640; --warn-bg:#33270f; --bad:#ef7a70; --bad-bg:#3a1b19;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:14px/1.5 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;text-wrap:balance;margin:0;letter-spacing:.005em}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
button,.btn{font:inherit;font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r);padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
button:hover{border-color:var(--accent)}
.small-btn{font-size:12px;padding:4px 9px;text-decoration:none}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,label.file:focus-within{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:5px 7px;min-width:0}
input.cell{font-family:var(--f-mono);font-size:13px;width:100%;text-align:right;padding:4px 6px;font-variant-numeric:tabular-nums}
input.cell.txt{text-align:left;font-family:var(--f-body)}
input.cell.missing{border-color:var(--bad);background:var(--bad-bg)}
input.cell.changed{border-color:var(--accent)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.brand h1{font-size:19px;font-weight:800}
.brand .tick{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:3px;padding:1px 6px}
.live{display:flex;flex-wrap:wrap;gap:6px 20px;margin-left:auto;align-items:center}
.live .kv{display:flex;flex-direction:column;line-height:1.15}
.live .kv b{font-family:var(--f-mono);font-size:15px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;letter-spacing:.06em;border-radius:999px;padding:4px 10px;border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.pill.warn{background:var(--warn-bg,var(--surface));color:var(--warn,var(--ink));border-color:var(--warn,var(--line))}
.pill.BUY{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.pill.SELL{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.pill.HOLD{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.pill.SUSPENDED{background:var(--surface-2);color:var(--bad);border-color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* shell */
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);gap:20px;align-items:start;padding-block:18px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);display:flex;flex-direction:column;gap:2px}
nav.rail .grp{margin:12px 0 4px 8px}
nav.rail a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink-2);padding:7px 10px;border-radius:var(--r);font-weight:500}
nav.rail a:hover{background:var(--surface-2);color:var(--ink)}
nav.rail a[aria-current="page"]{background:var(--accent-2);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
nav.rail .badge{font-family:var(--f-mono);font-size:11px;border-radius:999px;padding:0 6px}
.badge.err{background:var(--bad-bg);color:var(--bad)} .badge.warn{background:var(--warn-bg);color:var(--warn)}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.view-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px}
.view-head p{color:var(--ink-2);max-width:72ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel > h3{margin-bottom:10px}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.05fr) minmax(0,1.6fr)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}

/* verdict ticket */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}
.ticket-top{padding:16px 18px;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:start}
.verdict{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:44px;line-height:1}
.verdict.BUY{color:var(--good)} .verdict.SELL{color:var(--bad)} .verdict.HOLD{color:var(--warn)} .verdict.SUSPENDED{color:var(--bad);font-size:32px}
.meter{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.meter > div{padding:12px 18px;border-bottom:1px solid var(--line-2)}
.meter > div:nth-child(odd){border-right:1px solid var(--line-2)}
.meter .v{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.meter .v.up{color:var(--good)} .meter .v.down{color:var(--bad)}
.ticket-foot{padding:10px 18px;font-size:12px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 14px}

/* tables */
.tbl-wrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:600;border-top:1px solid var(--line);background:var(--surface-2)}
tr.sub td{color:var(--ink-3)}
td.lbl{white-space:nowrap}
.tbl-edit td{padding:3px 4px}
.tbl-edit td.lbl{padding-left:8px}
.status{display:inline-flex;gap:6px;align-items:center;font-weight:600;font-size:12px;white-space:nowrap}
.status.ok{color:var(--good)} .status.warn{color:var(--warn)} .status.err{color:var(--bad)}
.ico{width:14px;height:14px;flex:none}
.criteria{display:flex;flex-direction:column;gap:6px}
.crit{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start}
.note{border-left:3px solid var(--accent);background:var(--accent-2);padding:10px 12px;border-radius:0 var(--r) var(--r) 0;color:var(--ink)}
.note.warn{border-color:var(--warn);background:var(--warn-bg)}
.note.bad{border-color:var(--bad);background:var(--bad-bg)}
.kvlist{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px}
.kvlist dt{color:var(--ink-3)} .kvlist dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
label.file{position:relative;overflow:hidden}
label.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:12px;color:var(--ink-2);font-weight:500}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.unit{font-size:11px;color:var(--ink-3)}
.src{font-size:11px;color:var(--ink-3);margin-top:2px}
.bar-inline{height:8px;border-radius:0 4px 4px 0;display:block}
.log{font-family:var(--f-mono);font-size:12px;max-height:220px;overflow:auto;border:1px solid var(--line-2);border-radius:4px;padding:6px 8px;background:var(--surface-2)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:var(--r);box-shadow:var(--shadow);z-index:40;max-width:min(420px,calc(100vw - 32px))}
.doc{max-width:78ch;display:flex;flex-direction:column;gap:10px}
.doc h3{margin-top:10px}
.doc code{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);padding:1px 4px;border-radius:3px}
.formula{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);border-radius:4px;padding:8px 10px;overflow-x:auto;white-space:pre}
svg text{font-family:var(--f-body)}
svg .tnum{font-family:var(--f-mono)}
.chart{width:100%;height:auto;display:block}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:4px;z-index:50;max-width:260px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-2px}
.heat td.n{border:1px solid var(--line-2)}
.heat td.base{outline:2px solid var(--accent);outline-offset:-2px;font-weight:600}
.callout-num{font-family:var(--f-mono);font-size:26px;font-weight:600}
@media (max-width: 980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav.rail .grp{display:none}
  nav.rail a{white-space:nowrap;border:1px solid var(--line)}
  .g-dash,.g2,.g3{grid-template-columns:minmax(0,1fr)}
  .live{margin-left:0}
}
@media (max-width: 520px){ .verdict{font-size:36px} .meter .v{font-size:18px} .meter{grid-template-columns:minmax(0,1fr)} .meter > div:nth-child(odd){border-right:0} }
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header class="topbar"><div class="topbar-in">
  <div class="brand"><h1>Equity Valuation Platform</h1><span class="tick" id="tb-tick"></span><span class="muted small" id="tb-co"></span></div>
  <div class="live" id="live"></div>
</div></header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Views"></nav>
  <main id="main"></main>
</div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>/* BIRD Valuation Platform - calculation engine (JavaScript).
 * Pure functions: valuate(data) -> results. No DOM access.
 * Mirrors engine_ref.py (Python reference engine); test_engines.js checks both agree.
 * Units: IDR million; per-share in IDR; shares in million. */
(function (root) {
  "use strict";
  const sum = a => a.reduce((s, x) => s + x, 0);
  const median = a => { const x = a.filter(v => v !== null && v !== undefined && !Number.isNaN(v)).slice().sort((p, q) => p - q);
    if (!x.length) return null; const m = Math.floor(x.length / 2); return x.length % 2 ? x[m] : (x[m - 1] + x[m]) / 2; };
  const mean = a => sum(a) / a.length;
  const stdev = a => { const m = mean(a); return Math.sqrt(sum(a.map(v => (v - m) ** 2)) / (a.length - 1)); };
  const isNum = v => typeof v === "number" && Number.isFinite(v);
  const daysBetween = (a, b) => { const p = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
    return Math.abs(Math.round((p(a) - p(b)) / 86400000)); };
  const pct = (v, d = 1) => (v * 100).toFixed(d) + "%";
  const fmt0 = v => Math.abs(v) < 100 ? v.toLocaleString("en-US", {maximumFractionDigits: 2}) : Math.round(v).toLocaleString("en-US");

  function historicals(D) {
    const f = D.financials, m = D.market, n = f.years.length, L = n - 1, t = m.tax;
    const g = (k, i) => f[k][i];
    const idx = [...Array(n).keys()];
    const ebitda = idx.map(i => g("da", i) == null ? null : g("ebit", i) + g("da", i));
    const debt = idx.map(i => g("bankLoans", i) == null ? null : g("bankLoans", i) + (g("leases", i) || 0));
    const netCapex = idx.map(i => g("capex", i) == null ? null : g("capex", i) - (g("disposalProceeds", i) || 0));
    const invested = idx.map(i => debt[i] == null ? null : g("equityTotal", i) + debt[i] - g("cash", i));
    const ebitMargin = idx.map(i => g("ebit", i) / g("revenue", i));
    const growth = idx.map(i => i === 0 ? null : g("revenue", i) / g("revenue", i - 1) - 1);
    const reinv = idx.map(i => {
      if (netCapex[i] == null || g("da", i) == null) return null;
      let dn = 0;
      if (i > 0 && f.opNWC[i] != null && f.opNWC[i - 1] != null) dn = f.opNWC[i] - f.opNWC[i - 1];
      return netCapex[i] - g("da", i) + dn;
    });
    const fcff = idx.map(i => reinv[i] == null ? null : g("ebit", i) * (1 - t) - reinv[i]);
    return {
      n, L, ebitda, debt, netCapex, invested, ebitMargin, growth, reinv, fcff,
      marginalS2C: (g("revenue", L) - g("revenue", L - 2)) / (reinv[L - 1] + reinv[L]),
      ebitdaMargin: ebitda[L] / g("revenue", L), daPct: g("da", L) / g("revenue", L),
      cagr: Math.pow(g("revenue", L) / g("revenue", 0), 1 / (n - 1)) - 1,
      capexIntensity: netCapex[L] / g("revenue", L),
      roe: g("niParent", L) / g("equityParent", L),
      roic: g("ebit", L) * (1 - t) / invested[L],
      bvps: g("equityParent", L) / m.sharesMn, eps: g("eps", L),
      interestCover: g("ebit", L) / g("financeCharges", L),
      sdMargin: stdev(ebitMargin),
      posEbitYears: f.ebit.filter(x => x > 0).length,
      posCfoYears: f.cfo.filter(x => x > 0).length,
      bookDE: debt[L] / g("equityTotal", L),
      debtL: debt[L], cashL: g("cash", L), nciL: g("nci", L), revL: g("revenue", L)
    };
  }

  function wacc(D, H) {
    const m = D.market, mcap = m.price * m.sharesMn, debt = H.debtL, de = debt / mcap;
    const betaL = m.betaU * (1 + (1 - m.tax) * de), ke = m.rf + betaL * m.erp, kd = m.rf + m.kdSpread;
    const we = mcap / (mcap + debt);
    return { mcap, debt, de, betaL, ke, kd, kdAT: kd * (1 - m.tax), we, wd: 1 - we, wacc: we * ke + (1 - we) * kd * (1 - m.tax) };
  }

  function dcf(D, H, W, sc, o = {}) {
    const t = D.market.tax;
    const w = o.waccOverride != null ? o.waccOverride : W.wacc + sc.waccAdj;
    const gT = sc.gTerminal + (o.gAdd || 0);
    let prev = H.revL;
    const out = { rev: [], ebitda: [], ebit: [], nopat: [], reinv: [], fcff: [], df: [], pv: [], rnc: [] };
    for (let i = 0; i < sc.growth.length; i++) {
      const r = prev * (1 + sc.growth[i] + (o.growthAdd || 0));
      const em = (o.margin != null ? o.margin : sc.ebitdaMargin[i]) + (o.marginAdd || 0);
      const e = r * em, ebit = r * (em - sc.daPct[i]), nop = ebit * (1 - t);
      const s2c = sc.s2c[i] + (o.s2cAdd || 0);
      const rv = (r - prev) / s2c, fc = nop - rv, df = 1 / Math.pow(1 + w, i + 1);
      out.rev.push(r); out.ebitda.push(e); out.ebit.push(ebit); out.nopat.push(nop); out.reinv.push(rv);
      out.fcff.push(fc); out.df.push(df); out.pv.push(fc * df); out.rnc.push(nop / r * s2c);
      prev = r;
    }
    const ronic = w + D.assumptions.ronicPremium;
    const nopatT1 = out.nopat[out.nopat.length - 1] * (1 + gT), termReinvRate = gT / ronic, fcffT1 = nopatT1 * (1 - termReinvRate);
    const tv = fcffT1 / (w - gT), pvTV = tv * out.df[out.df.length - 1], sumPV = sum(out.pv), ev = sumPV + pvTV;
    const equity = ev - H.debtL + H.cashL - H.nciL;
    return Object.assign(out, { wacc: w, g: gT, ronic, nopatT1, termReinvRate, fcffT1, tv, pvTV, sumPV, ev, equity,
      vps: equity / D.market.sharesMn, tvShare: pvTV / ev });
  }

  function relative(D, H) {
    const m = D.market;
    const rows = D.peers.map(p => {
      const mcap = p.price * p.sharesMn;
      return { ticker: p.ticker, mcap, ev: mcap + p.debt - p.cash,
        pe: p.eps && p.eps > 0 ? p.price / p.eps : null,
        pbv: p.bvps && p.bvps > 0 ? p.price / p.bvps : null,
        evEbitda: p.evEbitda && p.evEbitda > 0 ? p.evEbitda : null,
        bookDE: p.debt / (p.bvps * p.sharesMn) };
    });
    const pe = rows.map(r => r.pe).filter(v => v != null), pbv = rows.map(r => r.pbv).filter(v => v != null),
      eve = rows.map(r => r.evEbitda).filter(v => v != null);
    const n = { pe: pe.length, pbv: pbv.length, eve: eve.length }, tot = n.pe + n.pbv + n.eve;
    const wts = {}; for (const k in n) wts[k] = tot ? n[k] / tot : 0;
    const eqFromEve = x => (x * H.ebitda[H.L] - H.debtL + H.cashL - H.nciL) / m.sharesMn;
    const conv = { pe: x => x * H.eps, pbv: x => x * H.bvps, eve: eqFromEve };
    const series = { pe, pbv, eve }, methods = {};
    for (const k of ["pe", "pbv", "eve"]) {
      const xs = series[k];
      methods[k] = xs.length ? { median: median(xs), min: Math.min(...xs), max: Math.max(...xs), value: conv[k](median(xs)),
        low: conv[k](Math.min(...xs)), high: conv[k](Math.max(...xs)), n: xs.length, weight: wts[k] }
        : { median: null, min: null, max: null, value: null, low: null, high: null, n: 0, weight: 0 };
    }
    let value = 0; for (const k in methods) if (methods[k].value != null) value += methods[k].value * methods[k].weight;
    return { rows, methods, value, cvPE: pe.length >= 2 ? stdev(pe) / mean(pe) : null,
      peerMcapMedian: median(rows.map(r => r.mcap)), peerBookDEMedian: median(rows.map(r => r.bookDE)),
      peerRevGrowthMedian: median(D.peers.map(p => p.revGrowth)) };
  }

  function reverse(D, H, W, base) {
    const price = D.market.price;
    const v1 = dcf(D, H, W, base, { margin: 0.20 }).vps, v2 = dcf(D, H, W, base, { margin: 0.27 }).vps;
    const im = 0.20 + (price - v1) * 0.07 / (v2 - v1);
    let lo = base.gTerminal + 0.005, hi = 0.40;
    for (let i = 0; i < 200; i++) { const mid = (lo + hi) / 2; if (dcf(D, H, W, base, { waccOverride: mid }).vps > price) lo = mid; else hi = mid; }
    return { impliedMargin: im, impliedWacc: (lo + hi) / 2, deliveredMargin: H.ebitdaMargin, cushion: H.ebitdaMargin - im };
  }

  function selector(D, H, W, R, b) {
    const P = D.profile, A = D.assumptions, peers = D.peers, np = peers.length, fin = !!P.isFinancial;
    const share = c => peers.filter(c).length / np;
    const F = [];
    const close = share(p => p.closeModel);
    F.push({ id: "F1", name: "Industry & business model", dcf: fin ? 0 : (H.capexIntensity >= A.capexHeavy ? 20 : 15),
      rel: fin ? 20 : 20 * close, dmax: 20, rmax: 20,
      evidence: `Net capex / revenue ${pct(H.capexIntensity)}; peers with close business model ${pct(close, 0)}`,
      rule: `DCF: financial firm 0 | net capex/revenue >= ${pct(A.capexHeavy, 0)} (reinvestment drives value) 20 | else 15. Multiples: financial firm 20 (P/BV standard) | else 20 x share of peers with a close business model.` });
    const gap = R.peerRevGrowthMedian != null ? Math.abs(H.growth[H.L] - R.peerRevGrowthMedian) : 1;
    F.push({ id: "F2", name: "Maturity & growth", dcf: (H.posEbitYears === H.n && H.cagr > 0 && H.cagr <= 0.20) ? 20 : 10,
      rel: gap <= 0.05 ? 20 : (gap <= 0.10 ? 10 : 0), dmax: 20, rmax: 20,
      evidence: `Revenue CAGR ${pct(H.cagr)}; growth gap to peer median ${pct(gap)}`,
      rule: "DCF: profitable every year and CAGR between 0% and 20% (forecastable, established) 20 | else 10. Multiples: growth gap to peer median <= 5pp 20 | <= 10pp 10 | else 0." });
    const sdp = H.sdMargin <= 0.01 ? 10 : (H.sdMargin <= 0.03 ? 5 : 0);
    const prof = share(p => p.eps > 0), grow = share(p => (p.niGrowth || 0) > 0);
    F.push({ id: "F3", name: "Profitability & cash-flow stability", dcf: 10 * H.posEbitYears / H.n + sdp, rel: 10 * prof + 10 * grow,
      dmax: 20, rmax: 20,
      evidence: `EBIT margin s.d. ${pct(H.sdMargin, 2)}; peers profitable ${pct(prof, 0)}, growing profit ${pct(grow, 0)}`,
      rule: "DCF: 10 x share of years with positive EBIT + margin s.d. <= 1pp 10 | <= 3pp 5. Multiples: 10 x share of profitable peers + 10 x share of peers with growing profit (depressed peer earnings distort multiples)." });
    const vd = D.meta.valuationDate, fresh = share(p => daysBetween(p.priceDate, vd) <= A.staleDays), aud = share(p => p.audited);
    F.push({ id: "F4", name: "Information availability & reliability", dcf: 10 * (P.auditedFS ? 1 : 0) + 10 * (P.guidance ? 1 : 0),
      rel: 10 * aud + 10 * fresh, dmax: 20, rmax: 20,
      evidence: `Audited FS ${P.auditedFS ? "yes" : "no"}, guidance ${P.guidance ? "yes" : "no"}; peers audited ${pct(aud, 0)}, fresh prices ${pct(fresh, 0)}`,
      rule: `DCF: audited statements 10 + management guidance/consensus 10. Multiples: 10 x share of audited peers + 10 x share of peer prices within ${A.staleDays} days.` });
    const nbest = Math.max(...Object.values(R.methods).map(x => x.n)), size = W.mcap / R.peerMcapMedian;
    F.push({ id: "F5", name: "Availability of suitable peers", dcf: 0,
      rel: (nbest >= 5 ? 10 : (nbest >= 3 ? 5 : 0)) + (size <= 3 ? 10 : (size <= 10 ? 5 : 0)), dmax: 0, rmax: 20,
      evidence: `Best-covered multiple has ${nbest} peers; the company is ${size.toFixed(0)}x the median peer size`,
      rule: "Multiples only: peers on best-covered multiple >= 5 10 | >= 3 5 | else 0; size ratio <= 3x 10 | <= 10x 5 | else 0." });
    const degap = Math.abs(H.bookDE - R.peerBookDEMedian);
    F.push({ id: "F6", name: "Capital structure & financial-sector fit", dcf: fin ? 0 : (W.de <= 1.5 ? 20 : 10),
      rel: degap <= 0.5 ? 20 : (degap <= 1.0 ? 10 : 0), dmax: 20, rmax: 20,
      evidence: `Market D/E ${W.de.toFixed(2)}; book D/E ${H.bookDE.toFixed(2)} vs peer median ${R.peerBookDEMedian.toFixed(2)}; financial firm: ${fin ? "yes" : "no"}`,
      rule: "DCF (FCFF): financial firm 0 (debt is raw material, use FCFE/DDM) | market D/E <= 1.5 20 | else 10. Multiples: book D/E gap to peers <= 0.5 20 | <= 1.0 10 | else 0 (leverage distorts P/E and P/BV)." });
    const cv = R.cvPE;
    F.push({ id: "F7", name: "Robustness of the result", dcf: b.tvShare <= 0.60 ? 20 : (b.tvShare <= 0.80 ? 10 : 0),
      rel: cv == null ? 0 : (cv <= 0.30 ? 20 : (cv <= 0.60 ? 10 : 0)), dmax: 20, rmax: 20,
      evidence: `Terminal value ${pct(b.tvShare, 0)} of EV; P/E dispersion CV ${cv == null ? "n/a" : cv.toFixed(2)}`,
      rule: "DCF: terminal value <= 60% of EV 20 | <= 80% 10 | else 0. Multiples: P/E coefficient of variation <= 0.30 20 | <= 0.60 10 | else 0." });
    const sd = sum(F.map(x => x.dcf)), sr = sum(F.map(x => x.rel)), md = sum(F.map(x => x.dmax)), mr = sum(F.map(x => x.rmax));
    const fd = sd / md, fr = sr / mr, wd = fin ? 0 : (fd + fr > 0 ? fd / (fd + fr) : 0.5);
    return { factors: F, scoreDCF: sd, scoreREL: sr, maxDCF: md, maxREL: mr, fitDCF: fd, fitREL: fr, wDCF: wd, wREL: 1 - wd,
      primary: wd >= 0.6 ? "DCF-led" : (wd <= 0.4 ? "Multiples-led" : "Balanced") };
  }

  function checks(D, H, W, R, S, dcfs) {
    const m = D.market, f = D.financials, A = D.assumptions, L = H.L, C = [];
    const add = (id, name, severity, ok, detail) => C.push({ id, name, severity, ok: !!ok, detail });
    const req = ["price", "sharesMn", "rf", "erp", "betaU", "tax", "kdSpread"].map(k => m[k]);
    const reqf = ["revenue", "ebit", "da", "netIncome", "niParent", "eps", "capex", "totalAssets", "totalLiabilities",
      "equityTotal", "equityParent", "nci", "cash", "bankLoans"].map(k => f[k][L]);
    const miss = req.concat(reqf).filter(x => !isNum(x)).length;
    add("C01", "Required inputs present", "ERROR", miss === 0 && D.peers.length > 0, `${miss} missing required inputs; ${D.peers.length} peers`);
    const unitOk = m.price > 0 && m.sharesMn >= 100 && m.sharesMn <= 100000 && m.rf > 0 && m.rf < 0.5 && m.erp > 0 && m.erp < 0.5
      && m.tax >= 0 && m.tax < 0.5 && m.betaU >= 0.2 && m.betaU <= 3;
    add("C02", "Units & ranges of market inputs", "ERROR", unitOk, "Price > 0, shares in million (100-100,000), rates as decimals");
    const epsCalc = f.niParent[L] / m.sharesMn;
    add("C03", "Share count consistent with EPS", "ERROR", Math.abs(epsCalc / f.eps[L] - 1) <= 0.05,
      `Profit to parent / shares = ${epsCalc.toFixed(1)} vs reported EPS ${f.eps[L]}`);
    const bs = Math.max(...f.years.map((_, i) => Math.abs(f.totalAssets[i] - f.totalLiabilities[i] - f.equityTotal[i]) / f.totalAssets[i]));
    add("C04", "Balance sheet balances (A = L + E)", "ERROR", bs <= 0.005, `Max gap ${pct(bs, 3)} of assets`);
    const sc = Object.values(A.scenarios), gmax = Math.max(...sc.map(s => s.gTerminal));
    add("C05", "Terminal growth below risk-free rate", "ERROR", gmax < m.rf, `Highest g ${pct(gmax, 2)} vs Rf ${pct(m.rf, 2)}`);
    const gw = Math.min(...Object.values(dcfs).map(d => d.wacc - d.g));
    add("C06", "Terminal growth at least 1pp below WACC", "ERROR", gw >= 0.01, `Smallest WACC - g spread ${pct(gw, 2)}`);
    add("C07", "Terminal growth within long-run GDP cap", "WARN", gmax <= A.maxG, `Highest g ${pct(gmax, 2)} vs cap ${pct(A.maxG, 0)}`);
    const sane = sc.every(s => s.ebitdaMargin.every(x => x > 0 && x < 1) && s.daPct.every((x, i) => x < s.ebitdaMargin[i]) && s.s2c.every(x => x > 0));
    add("C08", "Forecast drivers valid (0 < margin < 1, D&A < EBITDA, S/C > 0)", "ERROR", sane, "All scenarios");
    const ps = sum(sc.map(s => s.probability));
    add("C09", "Scenario probabilities sum to 100%", "ERROR", Math.abs(ps - 1) < 1e-9, `Sum ${pct(ps, 0)}`);
    const bad = D.peers.filter(p => !(p.eps && p.eps > 0)).map(p => p.ticker);
    add("C10", "Invalid multiples excluded (negative earnings)", "WARN", !bad.length, bad.length ? "Excluded from P/E: " + bad.join(", ") : "None");
    const thin = Object.entries(R.methods).filter(([, v]) => v.n > 0 && v.n < 3).map(([k]) => k.toUpperCase());
    add("C11", "Each used multiple has >= 3 peers", "WARN", !thin.length, thin.length ? "Thin: " + thin.join(", ") : "OK");
    const b = dcfs.base;
    const rec1 = Math.abs(b.sumPV + b.pvTV - b.ev) < 1e-6 && Math.abs(b.ev - H.debtL + H.cashL - H.nciL - b.equity) < 1e-6;
    const mev = W.mcap + H.debtL - H.cashL + H.nciL, rec2 = Math.abs(mev - H.debtL + H.cashL - H.nciL - W.mcap) < 1e-6;
    add("C12", "Enterprise-to-equity reconciliation (DCF and market)", "ERROR", rec1 && rec2,
      "EV = PV(FCFF) + PV(TV); Equity = EV - debt + cash - NCI; market EV bridges back to market cap");
    add("C13", "Scenario values ordered Bear <= Base <= Bull", "WARN", dcfs.bear.vps <= dcfs.base.vps && dcfs.base.vps <= dcfs.bull.vps, "DCF value per share");
    add("C14", "WACC within plausible range (6%-20%)", "WARN", W.wacc >= 0.06 && W.wacc <= 0.20, `WACC ${pct(W.wacc, 2)}`);
    add("C15", "Terminal value share of EV <= 80%", "WARN", b.tvShare <= 0.80, `TV share ${pct(b.tvShare, 0)}`);
    const vd = D.meta.valuationDate, stale = D.peers.filter(p => daysBetween(p.priceDate, vd) > A.staleDays).map(p => p.ticker);
    if (daysBetween(m.priceDate, vd) > A.staleDays) stale.push(D.meta.ticker);
    add("C16", "Prices current vs valuation date", "WARN", !stale.length, stale.length ? "Stale: " + stale.join(", ") : `All within ${A.staleDays} days`);
    add("C17", "Method weights sum to 100%", "ERROR", Math.abs(S.wDCF + S.wREL - 1) < 1e-9 &&
      Math.abs(sum(Object.values(R.methods).map(v => v.weight)) - 1) < 1e-9, "Selector and relative weights");
    return C;
  }

  function recommend(D, H, W, R, S, dcfs, rev, C) {
    const A = D.assumptions, price = D.market.price, sc = A.scenarios, bl = {};
    for (const k in sc) bl[k] = S.wDCF * dcfs[k].vps + S.wREL * R.value;
    const vals = Object.values(bl), central = bl.base, low = Math.min(...vals), high = Math.max(...vals);
    let pw = 0; for (const k in sc) pw += sc[k].probability * bl[k];
    const up = central / price - 1;
    const errors = C.filter(c => c.severity === "ERROR" && !c.ok).length, warnings = C.filter(c => c.severity === "WARN" && !c.ok).length;
    const sig = up >= A.buy ? "BUY" : (up <= A.sell ? "SELL" : "HOLD");
    const gap = Math.abs(dcfs.base.vps - R.value) / ((dcfs.base.vps + R.value) / 2);
    const pos = price < low ? "below range" : (price > high ? "above range" : "inside range");
    const im = rev.impliedMargin, cm = rev.deliveredMargin;
    const rv = sig === "BUY" ? im < cm : (sig === "SELL" ? im > cm : Math.abs(im - cm) <= A.reverseTol);
    const criteria = [
      { id: "K1", name: `Methods agree (gap <= ${pct(A.agreeHigh, 0)})`, ok: gap <= A.agreeHigh, detail: `DCF vs multiples gap ${pct(gap)}` },
      { id: "K2", name: "Price position confirms the signal", ok: (sig === "BUY" && pos === "below range") || (sig === "SELL" && pos === "above range") || (sig === "HOLD" && pos === "inside range"),
        detail: `Price is ${pos} (${(D.meta && D.meta.currency) || ""} ${fmt0(low)} - ${fmt0(high)})` },
      { id: "K3", name: "Reverse DCF confirms the signal", ok: rv, detail: `Implied EBITDA margin ${pct(im)} vs delivered ${pct(cm)}` },
      { id: "K4", name: "No validation warnings", ok: warnings === 0, detail: `${warnings} warning(s)` }
    ];
    const k = criteria.filter(c => c.ok).length;
    const conviction = gap > A.agreeLow ? "Low" : (k >= 3 ? "High" : (k >= 2 ? "Medium" : "Low"));
    return { blended: bl, central, low, high, probWeighted: pw, upside: up, upsideLow: low / price - 1, upsideHigh: high / price - 1,
      signal: sig, final: errors ? "SUSPENDED" : sig, errors, warnings, gap, pricePosition: pos, criteria, criteriaMet: k, conviction };
  }

  function sensitivity(D, H, W, R, S, base) {
    const b = dcf(D, H, W, base);
    const waccs = [-0.02, -0.01, 0, 0.01, 0.02].map(x => b.wacc + x), gs = [-0.01, -0.005, 0, 0.005, 0.01].map(x => base.gTerminal + x);
    const grid = waccs.map(w => gs.map(g => dcf(D, H, W, base, { waccOverride: w, gAdd: g - base.gTerminal }).vps));
    const blend = (dv, rv = R.value) => S.wDCF * dv + S.wREL * rv;
    const V = o => dcf(D, H, W, base, o).vps;
    const T = [];
    const tor = (driver, lo, hi, lowLabel, highLabel) => T.push({ driver, low: lo, high: hi, lowLabel, highLabel, swing: Math.abs(hi - lo) });
    tor("WACC +/-1pp", blend(V({ waccOverride: b.wacc + 0.01 })), blend(V({ waccOverride: b.wacc - 0.01 })), "+1pp", "-1pp");
    tor("EBITDA margin +/-2pp", blend(V({ marginAdd: -0.02 })), blend(V({ marginAdd: 0.02 })), "-2pp", "+2pp");
    tor("Revenue growth +/-3pp", blend(V({ growthAdd: 0.03 })), blend(V({ growthAdd: -0.03 })), "+3pp", "-3pp");
    tor("Sales-to-capital +/-0.2", blend(V({ s2cAdd: -0.2 })), blend(V({ s2cAdd: 0.2 })), "-0.2", "+0.2");
    tor("Terminal growth +/-0.5pp", blend(V({ gAdd: -0.005 })), blend(V({ gAdd: 0.005 })), "-0.5pp", "+0.5pp");
    tor("Peer multiples +/-20%", blend(b.vps, R.value * 0.8), blend(b.vps, R.value * 1.2), "-20%", "+20%");
    for (const t of T) if (t.low > t.high) { [t.low, t.high] = [t.high, t.low]; [t.lowLabel, t.highLabel] = [t.highLabel, t.lowLabel]; }
    T.sort((p, q) => q.swing - p.swing);
    return { waccs, gs, grid, tornado: T, center: blend(b.vps) };
  }

  function valuate(D) {
    const H = historicals(D), W = wacc(D, H), sc = D.assumptions.scenarios, dcfs = {};
    for (const k in sc) dcfs[k] = dcf(D, H, W, sc[k]);
    const R = relative(D, H), rev = reverse(D, H, W, sc.base), S = selector(D, H, W, R, dcfs.base);
    const C = checks(D, H, W, R, S, dcfs), REC = recommend(D, H, W, R, S, dcfs, rev, C), SEN = sensitivity(D, H, W, R, S, sc.base);
    return { hist: H, wacc: W, dcf: dcfs, relative: R, reverse: rev, selector: S, checks: C, rec: REC, sens: SEN };
  }

  const api = { valuate, dcf, historicals, wacc, relative, median, daysBetween };
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.BirdEngine = api;
})(typeof window !== "undefined" ? window : this);
</script>

  const sc = d.assumptions.scenarios;
  for (const k of ["bear","base","bull"]) { const s = sc[k]; if (!s) { out.push({path:"assumptions.scenarios."+k, label:k+" scenario"}); continue; }
    ["growth","ebitdaMargin","daPct","s2c"].forEach(dr => s[dr].forEach((v,i) => { if (!isNum(v)) out.push({path:`assumptions.scenarios.${k}.${dr}.${i}`, label:`${s.label} ${dr} ${d.assumptions.forecastYears[i]}`}); }));
    ["gTerminal","waccAdj","probability"].forEach(dr => { if (!isNum(s[dr])) out.push({path:`assumptions.scenarios.${k}.${dr}`, label:`${s.label} ${dr}`}); }); }
  return out;
}

/* ---------------- recalculation ---------------- */
function recalc(opts = {}){
  missing = preValidate(D); calcError = null; R = null;
  if (!missing.length) { try { R = BirdEngine.valuate(D); } catch(e) { calcError = e.message || String(e); } }
  calcAt = nowISO();
  saveDraft(); renderLive(); renderRail();
  if (opts.render !== false) renderView();
  else refreshResultBits();
}
let recalcTimer = null;
function scheduleRecalc(){ clearTimeout(recalcTimer); recalcTimer = setTimeout(() => recalc({render:false}), 120); }

/* ---------------- charts (SVG) ---------------- */
function tipOn(e, html){ const t = document.getElementById("tip"); t.innerHTML = html; t.hidden = false;
  const x = Math.min(e.clientX + 14, window.innerWidth - t.offsetWidth - 8), y = e.clientY + 14; t.style.left = x+"px"; t.style.top = y+"px"; }
function tipOff(){ document.getElementById("tip").hidden = true; }
function niceTicks(lo, hi, n=5){ const span = hi-lo, step0 = span/n, mag = Math.pow(10, Math.floor(Math.log10(step0))), r = step0/mag;
  const step = (r>=5?10:r>=2?5:r>=1?2:1)*mag; const out=[]; for (let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) out.push(v); return out; }

function footballField(rows, price, central, opts = {}){
  const W = 760, lw = 170, rp = 24, rowH = 34, top = 30, H = top + rows.length*rowH + 34;
  const cap = 2.2 * Math.max(price, central);   // axis cap: outliers beyond this are clipped and labelled
  const vals = rows.flatMap(r => [r.low, r.high, r.point]).concat([price, central]).filter(isNum).map(v => Math.min(v, cap));
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi-lo)*0.08; lo = Math.max(0, lo-pad); hi = hi+pad;
  const ticks = niceTicks(lo, hi, 6); lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length-1]);
  const x = v => lw + (v-lo)/(hi-lo)*(W-lw-rp);
  const col = opts.literal ? {ink:"#14202c",ink3:"#6f7d8b",line:"#d6dde4",s1:"#2a78d6",s2:"#eb6834",s3:"#1baf7a",acc:"#0d5c8a",surface:"#ffffff"} :
    {ink:"var(--ink)",ink3:"var(--ink-3)",line:"var(--line)",s1:"var(--s1)",s2:"var(--s2)",s3:"var(--s3)",acc:"var(--accent)",surface:"var(--surface)"};
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Valuation ranges by method in ${esc(CUR())} per share, with market price and central estimate">`;
  ticks.forEach(t => s += `<line x1="${x(t)}" x2="${x(t)}" y1="${top-6}" y2="${H-28}" stroke="${col.line}" stroke-width="1"/><text x="${x(t)}" y="${H-12}" text-anchor="middle" font-size="11" fill="${col.ink3}" class="tnum">${f0(t)}</text>`);
  rows.forEach((r,i) => {
    const y = top + i*rowH, c = col[r.color] || col.s1;
    s += `<text x="0" y="${y+rowH/2+4}" font-size="12.5" fill="${col.ink}" font-weight="${r.strong?700:500}">${esc(r.label)}</text>`;
    if (isNum(r.low) && isNum(r.high) && r.high - r.low > 0.5) {
      const clipped = r.high > hi, x1 = x(r.low), x2 = x(Math.min(r.high, hi));
      s += `<rect x="${x1}" y="${y+8}" width="${Math.max(2,x2-x1)}" height="${rowH-16}" rx="4" fill="${c}" opacity="${r.strong?1:.85}" data-tip="${esc(r.label)}: ${CUR()} ${f0(r.low)} – ${f0(r.high)}${isNum(r.point)?" · point "+CUR()+" "+f0(r.point):""}"/>`;
      if (clipped) s += `<text x="${x2-4}" y="${y+rowH/2+4}" text-anchor="end" font-size="11" font-weight="600" fill="${col.surface}" class="tnum">→ ${f0(r.high)}</text>`;
    }
    if (isNum(r.point)) s += `<circle cx="${x(r.point)}" cy="${y+rowH/2}" r="5" fill="${col.surface}" stroke="${c}" stroke-width="2.5" data-tip="${esc(r.label)}: ${CUR()} ${f0(r.point)}"/>`;
  });
  const xp = x(price), xc = x(central);
  s += `<line x1="${xp}" x2="${xp}" y1="${top-8}" y2="${H-28}" stroke="${col.ink}" stroke-width="2" stroke-dasharray="4 3"/>`;
  s += `<text x="${xp}" y="${top-12}" text-anchor="${xp > W-120 ? "end":"middle"}" font-size="11.5" font-weight="700" fill="${col.ink}">Price ${f0(price)}</text>`;
  s += `<line x1="${xc}" x2="${xc}" y1="${top-2}" y2="${H-28}" stroke="${col.acc}" stroke-width="2"/>`;
  s += `<text x="${xc}" y="${H-28+0}" dy="-4" text-anchor="${xc < xp ? "end":"start"}" dx="${xc < xp ? -4 : 4}" font-size="11.5" font-weight="700" fill="${col.acc}">Central ${f0(central)}</text>`;
  return s + `</svg>`;
}

function tornadoChart(T, center){
  const W = 760, lw = 190, rp = 60, rowH = 30, top = 18, H = top + T.length*rowH + 30;
  const vals = T.flatMap(t => [t.low, t.high]).concat([center]); let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi-lo)*0.06; lo -= pad; hi += pad; const ticks = niceTicks(lo, hi, 6);
  const x = v => lw + (v-lo)/(hi-lo)*(W-lw-rp);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tornado chart: blended value per share when each driver moves">`;
  ticks.forEach(t => s += `<line x1="${x(t)}" x2="${x(t)}" y1="${top-4}" y2="${H-24}" stroke="var(--line-2)"/><text x="${x(t)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--ink-3)" class="tnum">${f0(t)}</text>`);
  T.forEach((t,i) => { const y = top + i*rowH, xc = x(center);
    s += `<text x="0" y="${y+rowH/2+4}" font-size="12.5" fill="var(--ink)">${esc(t.driver)}</text>`;
    s += `<rect x="${x(t.low)}" y="${y+6}" width="${Math.max(1, xc - x(t.low) - 1)}" height="${rowH-12}" rx="3" fill="var(--s2)" data-tip="${esc(t.driver)} ${esc(t.lowLabel)}: ${CUR()} ${f0(t.low)}"/>`;
    s += `<rect x="${xc+1}" y="${y+6}" width="${Math.max(1, x(t.high) - xc - 1)}" height="${rowH-12}" rx="3" fill="var(--s1)" data-tip="${esc(t.driver)} ${esc(t.highLabel)}: ${CUR()} ${f0(t.high)}"/>`;
    s += `<text x="${x(t.low)-4}" y="${y+rowH/2+4}" text-anchor="end" font-size="11" fill="var(--ink-2)" class="tnum">${f0(t.low)}</text>`;
    s += `<text x="${x(t.high)+4}" y="${y+rowH/2+4}" font-size="11" fill="var(--ink-2)" class="tnum">${f0(t.high)}</text>`; });
  s += `<line x1="${x(center)}" x2="${x(center)}" y1="${top-4}" y2="${H-24}" stroke="var(--ink)" stroke-width="1.5"/>`;
  return s + `</svg>`;
}

function barsChart(labels, series, opts = {}){ // series: [{name,color,values}]
  const W = 760, H = opts.h || 220, lp = 56, bp = 26, tp = 14, rp = 8;
  const all = series.flatMap(s => s.values).filter(isNum); let lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  const ticks = niceTicks(lo, hi, 4); lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length-1]);
  const y = v => tp + (hi - v)/(hi-lo)*(H-tp-bp), gw = (W-lp-rp)/labels.length, bw = Math.min(28, (gw-10)/series.length - 2);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria||"Bar chart")}">`;
  ticks.forEach(t => s += `<line x1="${lp}" x2="${W-rp}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line-2)"/><text x="${lp-6}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)" class="tnum">${opts.fmt?opts.fmt(t):f0(t)}</text>`);
  s += `<line x1="${lp}" x2="${W-rp}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ink-3)"/>`;
  labels.forEach((l,i) => { const gx = lp + i*gw + gw/2, tw = series.length*(bw+2);
    series.forEach((se,j) => { const v = se.values[i]; if (!isNum(v)) return; const bx = gx - tw/2 + j*(bw+2), y0 = y(0), yv = y(v);
      const h = Math.abs(yv-y0), yy = Math.min(yv,y0), r = Math.min(4, h/2);
      const path = v >= 0 ? `M${bx},${y0}V${yy+r}q0,-${r} ${r},-${r}h${bw-2*r}q${r},0 ${r},${r}V${y0}Z` : `M${bx},${y0}V${y0+h-r}q0,${r} ${r},${r}h${bw-2*r}q${r},0 ${r},-${r}V${y0}Z`;
      s += `<path d="${path}" fill="${se.color}" data-tip="${esc(se.name)} ${esc(l)}: ${opts.fmt?opts.fmt(v):f0(v)}"/>`; });
    s += `<text x="${gx}" y="${H-8}" text-anchor="middle" font-size="11.5" fill="var(--ink-2)">${esc(l)}</text>`; });
  return s + `</svg>`;
}
function legend(items){ return `<div class="legend">${items.map(([c,l]) => `<span><i style="background:${c}"></i>${esc(l)}</span>`).join("")}</div>`; }

function ffRows(){

/* data-driven narrative helpers: every sentence is rebuilt from the current inputs */
function peerProfitText(){
  const P = D.peers, n = P.length, fy = D.financials.years[D.financials.years.length-1];
  const grow = P.filter(p => (p.niGrowth||0) > 0).length, loss = P.filter(p => !(p.eps > 0)).length;
  if (!n) return "there are no peers";
  if (grow === 0) return `none of the ${n} peers grew profit in FY${fy}${loss ? ` (${loss} reported a loss)` : ""}`;
  if (grow === n) return `all ${n} peers grew profit in FY${fy}`;
  return `${grow} of ${n} peers grew profit in FY${fy}${loss ? `, ${loss} reported a loss` : ""}`;
}
function signalPrices(){ const A = D.assumptions, c = R.rec.central; return {buyBelow: c/(1+A.buy), sellAbove: c/(1+A.sell)}; }
function riskList(){
  const r = R.rec, dcb = R.dcf.base, rel = R.relative, H = R.hist, m = D.market, Y = D.assumptions.forecastYears;
  const tor = R.sens.tornado.find(t => t.driver.startsWith("EBITDA")) || {swing:0};
  const out = [];
  out.push(dcb.tvShare > 0.6
    ? `Terminal value is ${p0(dcb.tvShare)} of DCF enterprise value; base-case FCFF for ${Y[0]}–${Y[1]} ${dcb.fcff[0]+dcb.fcff[1] < 0 ? "is negative in total" : "totals only"} (${CUR()} ${bn(dcb.fcff[0]+dcb.fcff[1])}bn), so long-run margin and WACC drive most of the value.`
    : `Terminal value is ${p0(dcb.tvShare)} of DCF enterprise value, a moderate share; near-term cash flows carry a meaningful part of the value.`);
  out.push(dcb.rnc[0] < dcb.wacc
    ? `Return on new capital (${p1(dcb.rnc[0])}) is below WACC (${p1(dcb.wacc)}): faster growth lowers value unless capital efficiency or margins improve.`
    : `Return on new capital (${p1(dcb.rnc[0])}) exceeds WACC (${p1(dcb.wacc)}): growth creates value, so a growth shortfall is a downside risk.`);
  out.push(`Margin risk: ±2pp of EBITDA margin moves the central value by about ±${CUR()} ${f0(tor.swing/2)} per share.`);
  out.push(`Peer comparability: the median peer is about ${f0(R.wacc.mcap/rel.peerMcapMedian)}x smaller than ${esc(D.meta.ticker)}, ${peerProfitText()}, and P/E dispersion is ${rel.cvPE==null?"not measurable":"CV "+f2(rel.cvPE)}.`);
  out.push(`Cost of capital uses a bottom-up beta of ${f2(m.betaU)} (unlevered)${isNum(m.betaReg) ? ` instead of the regression beta of ${f2(m.betaReg)}` : ""} and an assumed ${p2(m.kdSpread)} debt spread over the risk-free rate.`);
  const sp = signalPrices();
  out.push(`Price sensitivity of the call: at the current central value the signal turns BUY below ${CUR()} ${f0(sp.buyBelow)} and SELL above ${CUR()} ${f0(sp.sellAbove)} (price observed ${esc(m.priceDate)}).`);
  return out;
}

function critList(C){ return `<div class="criteria">${C.map(c => `<div class="crit"><span class="status ${c.ok?"ok":"warn"}">${c.ok?ICON.ok:ICON.warn}</span><div><b>${esc(c.name)}</b><div class="small muted">${esc(c.detail)}</div></div></div>`).join("")}</div>`; }
function head(t, sub, right=""){ return `<div class="view-head"><div class="stack" style="gap:4px"><h2>${t}</h2>${sub?`<p>${sub}</p>`:""}</div>${right}</div>`; }

V.recommendation = () => {
  if (!R) return head("Recommendation") + suspendedNote();
  const r = R.rec, A = D.assumptions;
  return head("Recommendation", "How the signal and the conviction level are decided. Every rule and threshold is editable under Decision rules.") +
  `<div class="grid g2">
    <div class="panel"><h3>Step 1 · Signal from the central estimate</h3>
      <div class="formula">upside = central estimate / price − 1 = ${f0(r.central)} / ${f0(D.market.price)} − 1 = ${sp1(r.upside)}
BUY  if upside ≥ ${sp1(A.buy)}
SELL if upside ≤ ${sp1(A.sell)}
HOLD otherwise                         → ${r.signal}</div>
      <p class="small muted" style="margin-top:8px">The ±15% band reflects the precision of a small-cap valuation: inside it, the estimate cannot distinguish the price from fair value.</p></div>
    <div class="panel"><h3>Step 2 · Model integrity gate</h3>
      <p>${r.errors ? `<span class="status err">${ICON.err}${r.errors} validation error(s): recommendation suspended</span>` : `<span class="status ok">${ICON.ok}No validation errors: signal released</span>`}</p>
      <p class="small muted" style="margin-top:6px">Any failed ERROR check (missing inputs, g ≥ Rf, broken EV-to-equity bridge, invalid drivers) replaces the signal with SUSPENDED.</p></div>
  </div>
  <div class="panel"><h3>Step 3 · Conviction from four criteria</h3>${critList(r.criteria)}
    <div class="formula" style="margin-top:10px">gap = |DCF − Relative| / average = ${p1(r.gap)}
if gap > ${p0(A.agreeLow)}            → Low conviction (methods disagree)
else criteria met ≥ 3            → High
else criteria met = 2            → Medium
else                             → Low          → ${r.conviction} (${r.criteriaMet}/4)</div></div>
  <div class="panel"><h3>Final view</h3><p style="font-size:16px"><span class="pill ${r.final}"><span class="dot"></span>${r.final}</span> &nbsp;
    At ${CUR()} ${f0(D.market.price)}, ${esc(TK())} trades ${r.upside>=0?"below":"above"} its central estimate of ${CUR()} ${f0(r.central)} by ${p1(Math.abs(r.upside))}; the justified fair-value range is ${CUR()} ${f0(r.low)} – ${f0(r.high)} (Bear to Bull, blended).
    ${r.signal==="HOLD" ? `The price ${r.pricePosition==="inside range"?"sits inside":"is "+r.pricePosition+" of"} the fair-value range${r.criteria[2].ok?", and the reverse DCF shows the market pricing in roughly the margin the company delivers":""}, so the upside is too small for a BUY and the downside too small for a SELL.` : r.signal==="BUY" ? `The central value exceeds the price by more than the BUY threshold${r.pricePosition==="below range"?"; the price is even below the Bear-case value":""}.` : `The price exceeds the central value by more than the SELL threshold${r.pricePosition==="above range"?"; it is even above the Bull-case value":""}.`}</p></div>`;
};

  const m = D.market, H = R.hist, W = R.wacc, rv = R.reverse, mev = W.mcap + H.debtL - H.cashL + H.nciL;
  const pts = [0.19,0.21,0.23,0.25,0.27].map(mm => [mm, BirdEngine.dcf(D, H, W, D.assumptions.scenarios.base, {margin:mm}).vps]);
  return head("Market value analysis", `What the market pays for ${esc(TK())} on ${esc(m.priceDate)}, and what that price implies about future performance.`) +
  `<div class="grid g2">
    <div class="panel"><h3>Observed market valuation</h3><table><tbody>
      <tr><td>Share price</td><td class="n">${CUR()} ${f0(m.price)}</td></tr><tr><td>× Shares outstanding (mn)</td><td class="n">${f1(m.sharesMn)}</td></tr>
      <tr class="total"><td>Market capitalisation (${esc(CUR())} bn)</td><td class="n">${bn(W.mcap)}</td></tr>
      <tr><td>+ Debt (bank loans + leases)</td><td class="n">${bn(H.debtL)}</td></tr><tr><td>− Cash</td><td class="n">${bn(H.cashL)}</td></tr><tr><td>+ Non-controlling interests</td><td class="n">${bn(H.nciL)}</td></tr>
      <tr class="total"><td>Market enterprise value (${esc(CUR())} bn)</td><td class="n">${bn(mev)}</td></tr>
      <tr><td>EV / EBITDA ${D.financials.years[H.L]}</td><td class="n">${mx(mev/H.ebitda[H.L])}</td></tr><tr><td>P / E ${D.financials.years[H.L]}</td><td class="n">${mx(m.price/H.eps)}</td></tr>
      <tr><td>P / BV ${D.financials.years[H.L]}</td><td class="n">${mx(m.price/H.bvps)}</td></tr><tr><td>Dividend yield (last paid)</td><td class="n">${p1(D.financials.dividends[H.L]/W.mcap)}</td></tr></tbody></table>
      <p class="small muted" style="margin-top:8px">${m.price/H.bvps < 1 ? (H.roe < W.ke ? `P/BV below 1 is consistent with ROE (${p1(H.roe)}) below the cost of equity (${p1(W.ke)}): the market does not pay book value for capital that earns less than it costs.` : `P/BV is below 1 although ROE (${p1(H.roe)}) exceeds the cost of equity (${p1(W.ke)}): a possible sign of undervaluation or of expected falling returns.`) : (H.roe > W.ke ? `P/BV above 1 is consistent with ROE (${p1(H.roe)}) above the cost of equity (${p1(W.ke)}).` : `P/BV is above 1 although ROE (${p1(H.roe)}) is below the cost of equity (${p1(W.ke)}): the market expects returns to improve.`)}</p></div>
    <div class="panel"><h3>Reverse DCF: what the price implies</h3>
      <div class="grid g2" style="gap:10px"><div><div class="eyebrow">Implied EBITDA margin</div><div class="callout-num">${p1(rv.impliedMargin)}</div><div class="small muted">delivered ${p1(rv.deliveredMargin)} · cushion ${sp1(rv.cushion)}</div></div>
      <div><div class="eyebrow">Implied WACC</div><div class="callout-num">${p2(rv.impliedWacc)}</div><div class="small muted">model WACC ${p2(R.dcf.base.wacc)}</div></div></div>
      <p style="margin-top:10px">${Math.abs(rv.cushion) <= D.assumptions.reverseTol ? `The price requires roughly the margin ${esc(TK())} already earns: the market prices it close to fair value on today's economics.` : rv.cushion > 0 ? `The price requires a lower margin than ${esc(TK())} delivers: the market prices in margin erosion.` : `The price requires a higher margin than ${esc(TK())} delivers: the market prices in improvement.`}</p>
      <table style="margin-top:10px"><thead><tr><th>Uniform EBITDA margin</th><th class="n">DCF value / share</th><th class="n">vs price</th></tr></thead><tbody>
      ${pts.map(([mm,v]) => `<tr><td>${p1(mm)}</td><td class="n">${f0(v)}</td><td class="n">${sp1(v/m.price-1)}</td></tr>`).join("")}</tbody></table>
      <p class="small muted" style="margin-top:6px">Base-case growth, sales-to-capital, WACC and terminal growth held constant; value is linear in margin, so two points solve it exactly. Implied WACC solved by bisection.</p></div>
  </div>`;
};

V.dcf = () => {
  if (!R) return head("DCF") + suspendedNote();
  const W = R.wacc, m = D.market, sc = D.assumptions.scenarios[activeSc], d = R.dcf[activeSc], Y = D.assumptions.forecastYears, H = R.hist;
  const seg = `<div class="seg" role="group" aria-label="Scenario">${["bear","base","bull"].map(k => `<button data-act="sc" data-sc="${k}" aria-pressed="${k===activeSc}">${D.assumptions.scenarios[k].label}</button>`).join("")}</div>`;
  const row = (l, arr, fmt=bn, cls="") => `<tr class="${cls}"><td class="lbl">${l}</td>${arr.map(v=>`<td class="n">${fmt(v)}</td>`).join("")}</tr>`;
  return head("Discounted cash flow (FCFF)", "Free cash flow to the firm, discounted at WACC. Reinvestment is tied to growth through the sales-to-capital ratio, so growth is never free.", seg) +
  `<div class="grid g2">
    <div class="panel"><h3>Cost of capital</h3><table><tbody>
      <tr><td>Risk-free rate</td><td class="n">${p2(m.rf)}</td></tr><tr><td>Unlevered beta (sector, cash-corrected)</td><td class="n">${f2(m.betaU)}</td></tr>
      <tr><td>Market D/E</td><td class="n">${p1(W.de)}</td></tr><tr><td>Levered beta = βu × (1 + (1 − t) × D/E)</td><td class="n">${f2(W.betaL)}</td></tr>
      <tr><td>Equity risk premium</td><td class="n">${p2(m.erp)}</td></tr><tr class="total"><td>Cost of equity</td><td class="n">${p2(W.ke)}</td></tr>
      <tr><td>Cost of debt pre-tax (Rf + ${p2(m.kdSpread)})</td><td class="n">${p2(W.kd)}</td></tr><tr><td>Cost of debt after tax</td><td class="n">${p2(W.kdAT)}</td></tr>
      <tr><td>Weights E / D</td><td class="n">${p1(W.we)} / ${p1(W.wd)}</td></tr><tr class="total"><td>WACC</td><td class="n">${p2(W.wacc)}</td></tr>
      ${sc.waccAdj ? `<tr><td>${sc.label} scenario overlay</td><td class="n">${sp1(sc.waccAdj)}</td></tr><tr class="total"><td>WACC used (${sc.label})</td><td class="n">${p2(d.wacc)}</td></tr>`:""}</tbody></table></div>
    <div class="panel"><h3>Equity bridge · ${sc.label}</h3><table><tbody>
      <tr><td>PV of FCFF ${Y[0]}–${Y[Y.length-1]}</td><td class="n">${bn(d.sumPV)}</td></tr>
      <tr><td>Terminal value (end ${Y[Y.length-1]}) = FCFF<sub>T+1</sub> / (WACC − g)</td><td class="n">${bn(d.tv)}</td></tr>
      <tr><td>PV of terminal value</td><td class="n">${bn(d.pvTV)}</td></tr><tr class="total"><td>Enterprise value (${esc(CUR())} bn)</td><td class="n">${bn(d.ev)}</td></tr>
      <tr><td>− Debt</td><td class="n">${bn(H.debtL)}</td></tr><tr><td>+ Cash</td><td class="n">${bn(H.cashL)}</td></tr><tr><td>− Non-controlling interests</td><td class="n">${bn(H.nciL)}</td></tr>
      <tr class="total"><td>Equity value to parent (${esc(CUR())} bn)</td><td class="n">${bn(d.equity)}</td></tr><tr class="total"><td>Value per share (${esc(CUR())})</td><td class="n">${f0(d.vps)}</td></tr>
      <tr><td>Terminal value share of EV</td><td class="n">${p0(d.tvShare)}</td></tr><tr><td>Terminal growth g / RONIC</td><td class="n">${p2(d.g)} / ${p2(d.ronic)}</td></tr>
      <tr><td>Terminal reinvestment rate = g / RONIC</td><td class="n">${p1(d.termReinvRate)}</td></tr></tbody></table></div>
  </div>
  <div class="panel"><h3>Forecast · ${sc.label} (${esc(CUR())} bn)</h3><div class="tbl-wrap"><table><thead><tr><th></th><th class="n">${D.financials.years[H.L]}A</th>${Y.map(y=>`<th class="n">${y}E</th>`).join("")}</tr></thead><tbody>
    ${row("Revenue",[H.revL].concat(d.rev))}${row("Revenue growth",[H.growth[H.L]].concat(sc.growth),p1,"sub")}
    ${row("EBITDA",[H.ebitda[H.L]].concat(d.ebitda))}${row("EBITDA margin",[H.ebitdaMargin].concat(sc.ebitdaMargin),p1,"sub")}
    ${row("EBIT",[D.financials.ebit[H.L]].concat(d.ebit))}${row("NOPAT = EBIT × (1 − t)",[D.financials.ebit[H.L]*(1-m.tax)].concat(d.nopat))}
    ${row("Reinvestment = ΔRevenue / sales-to-capital",[H.reinv[H.L]].concat(d.reinv))}${row("Sales-to-capital",[NaN].concat(sc.s2c),f2,"sub")}
    ${row("FCFF",[H.fcff[H.L]].concat(d.fcff),bn,"total")}${row("Discount factor",[NaN].concat(d.df),v=>isNum(v)?v.toFixed(4):"",'sub')}
    ${row("PV of FCFF",[NaN].concat(d.pv))}${row("Return on new capital",[NaN].concat(d.rnc),p1,"sub")}</tbody></table></div>
    <div style="margin-top:12px">${legend([["var(--s1)","FCFF ("+CUR()+" bn)"]])}${barsChart([D.financials.years[H.L]+"A"].concat(Y.map(y=>y+"E")), [{name:"FCFF", color:"var(--s1)", values:[H.fcff[H.L]/1000].concat(d.fcff.map(v=>v/1000))}], {aria:"FCFF by year in "+CUR()+" bn", h:200})}</div>
    <p class="small muted">Return on new capital (NOPAT margin × sales-to-capital) ${d.rnc[0] < d.wacc ? "is below" : "exceeds"} WACC, so in this scenario faster growth ${d.rnc[0] < d.wacc ? "lowers" : "raises"} value. FY${D.financials.years[H.L]} FCFF was ${H.fcff[H.L] < 0 ? `negative (${CUR()} ${bn(H.fcff[H.L])}bn) because net reinvestment of ${CUR()} ${bn(H.reinv[H.L])}bn exceeded NOPAT` : `${CUR()} ${bn(H.fcff[H.L])}bn after net reinvestment of ${CUR()} ${bn(H.reinv[H.L])}bn`}.</p></div>`;
};

V.relative = () => {
  if (!R) return head("Relative valuation") + suspendedNote();
  const RL = R.relative, M = RL.methods, H = R.hist, m = D.market;
  const lab = {pe:"P/E", pbv:"P/BV", eve:"EV/EBITDA"}, base = {pe:`EPS ${f0(H.eps)}`, pbv:`BVPS ${f0(H.bvps)}`, eve:`EBITDA ${CUR()} ${bn(H.ebitda[H.L])}bn → equity bridge`};
  return head("Relative valuation", `${esc(TK())}'s own FY${D.financials.years[R.hist.L]} fundamentals × peer median multiples. Each multiple is weighted by the number of peers that support it.`) +
  `<div class="panel"><h3>Implied value by multiple</h3><div class="tbl-wrap"><table><thead><tr><th>Multiple</th><th class="n">Peers</th><th class="n">Min</th><th class="n">Median</th><th class="n">Max</th><th>Applied to</th><th class="n">Value / share</th><th class="n">Weight</th></tr></thead><tbody>
    ${Object.keys(M).map(k => `<tr><td>${lab[k]}</td><td class="n">${M[k].n}</td><td class="n">${mx(M[k].min)}</td><td class="n">${mx(M[k].median)}</td><td class="n">${mx(M[k].max)}</td><td class="small">${base[k]}</td><td class="n">${f0(M[k].value)}</td><td class="n">${p1(M[k].weight)}</td></tr>`).join("")}
    <tr class="total"><td colspan="6">Relative value per share (weighted)</td><td class="n">${f0(RL.value)}</td><td class="n">100%</td></tr></tbody></table></div>
    <p class="small muted" style="margin-top:8px">Equity multiples (P/E, P/BV) are applied to parent-company EPS and book value. EV/EBITDA gives an enterprise value that is bridged to equity (− debt + cash − NCI). Multiples from loss-making peers are excluded as invalid.</p></div>
  <div class="grid g2"><div class="panel"><h3>Peer comparability</h3><dl class="kvlist">
    <dt>${esc(TK())} market cap</dt><dd>${CUR()} ${bn(R.wacc.mcap)}bn</dd><dt>Median peer market cap</dt><dd>${CUR()} ${bn(RL.peerMcapMedian)}bn</dd>
    <dt>${esc(TK())} book D/E</dt><dd>${f2(H.bookDE)}</dd><dt>Median peer book D/E</dt><dd>${f2(RL.peerBookDEMedian)}</dd>
    <dt>${esc(TK())} revenue growth</dt><dd>${p1(H.growth[H.L])}</dd><dt>Median peer revenue growth</dt><dd>${p1(RL.peerRevGrowthMedian)}</dd>
    <dt>P/E dispersion (CV)</dt><dd>${f2(RL.cvPE)}</dd></dl></div>
  <div class="panel"><h3>Reading</h3><p>${esc(D.meta.ticker)} trades at ${mx(m.price/H.eps)} earnings versus a peer median of ${mx(M.pe.median)} (${m.price/H.eps < M.pe.median ? "a discount" : "a premium"}), and at ${mx(m.price/H.bvps)} book versus ${mx(M.pbv.median)} (${m.price/H.bvps < M.pbv.median ? "a discount" : "a premium"}). The median peer is about ${f0(R.wacc.mcap/RL.peerMcapMedian)}x smaller, ${p0(D.peers.filter(p=>p.closeModel).length/Math.max(1,D.peers.length))} of peers have a close business model, and ${peerProfitText()}. On these facts the method selector gives multiples ${p1(R.selector.wREL)} of the weight.</p></div></div>`;
};

V.selector = () => {
  if (!R) return head("Method selection") + suspendedNote();
  const S = R.selector;
  return head("Valuation approach selection", "Seven transparent tests score how well each approach fits this company. Fitness = points ÷ maximum; weight = fitness share. The weights feed the blended value directly.") +
  `<div class="grid g3">
    <div class="panel"><div class="eyebrow">DCF fitness</div><div class="callout-num" style="color:var(--s1)">${f1(S.scoreDCF)} / ${S.maxDCF}</div><div class="muted small">${p0(S.fitDCF)} → weight ${p1(S.wDCF)}</div></div>
    <div class="panel"><div class="eyebrow">Multiples fitness</div><div class="callout-num" style="color:var(--s2)">${f1(S.scoreREL)} / ${S.maxREL}</div><div class="muted small">${p0(S.fitREL)} → weight ${p1(S.wREL)}</div></div>
    <div class="panel"><div class="eyebrow">Selected approach</div><div class="callout-num">${S.primary}</div><div class="muted small">DCF-led ≥ 60% · Multiples-led ≤ 40% DCF weight</div></div></div>
  <div class="panel"><h3>Factor scores</h3>${legend([["var(--s1)","DCF points"],["var(--s2)","Multiples points"]])}<div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>Factor</th><th>Evidence (this company)</th><th class="n">DCF</th><th class="n">Multiples</th><th style="min-width:140px">Points</th></tr></thead><tbody>
    ${S.factors.map(f => `<tr><td><b>${f.id}</b> ${esc(f.name)}<div class="src" style="max-width:46ch">${esc(f.rule)}</div></td><td class="small">${esc(f.evidence)}</td>
      <td class="n">${f.dmax?f1(f.dcf)+" / "+f.dmax:"n/a"}</td><td class="n">${f1(f.rel)} / ${f.rmax}</td>
      <td><span class="bar-inline" style="width:${f.dmax?f.dcf/20*100:0}%;background:var(--s1)"></span><span class="bar-inline" style="width:${f.rel/20*100}%;background:var(--s2);margin-top:3px"></span></td></tr>`).join("")}
    <tr class="total"><td colspan="2">Total</td><td class="n">${f1(S.scoreDCF)} / ${S.maxDCF}</td><td class="n">${f1(S.scoreREL)} / ${S.maxREL}</td><td></td></tr></tbody></table></div></div>
  <div class="panel"><h3>When each approach deserves more weight</h3><div class="grid g2">
    <div><b style="color:var(--s1)">DCF gets more weight when</b><ul class="plain small" style="margin-top:6px"><li>the firm is profitable with stable margins and an established growth path (F2, F3);</li><li>reinvestment drives value, as in asset-heavy businesses (F1);</li><li>audited statements and guidance make forecasts traceable (F4);</li><li>the terminal value is a modest share of EV (F7).</li></ul></div>
    <div><b style="color:var(--s2)">Multiples get more weight when</b><ul class="plain small" style="margin-top:6px"><li>there are many listed peers of similar size and business model (F1, F5);</li><li>peer earnings are normal, not depressed or negative (F3);</li><li>leverage is similar, so equity multiples compare like with like (F6);</li><li>multiples cluster tightly (F7); for banks and insurers, P/BV replaces FCFF (F1, F6).</li></ul></div></div>
    <p style="margin-top:10px">${esc((() => { const H = R.hist, lead = S.fitDCF >= S.fitREL ? "DCF" : "multiples";
      return `For ${D.meta.ticker} the ${lead === "DCF" ? "DCF" : "multiples approach"} is the stronger tool. DCF fit ${p0(S.fitDCF)}: EBIT was positive in ${H.posEbitYears} of ${H.n} years, the EBIT margin moved by ${p2(H.sdMargin)} (s.d.), net reinvestment is ${p1(H.capexIntensity)} of revenue, and terminal value is ${p0(R.dcf.base.tvShare)} of EV. Multiples fit ${p0(S.fitREL)}: the median peer is ${f0(R.wacc.mcap/R.relative.peerMcapMedian)}x smaller, ${p0(D.peers.filter(p=>p.closeModel).length/Math.max(1,D.peers.length))} of peers have a close business model, ${peerProfitText()}, and P/E dispersion is ${R.relative.cvPE==null?"not measurable":"CV "+f2(R.relative.cvPE)}.`; })())}</p></div>`;
};

V.sensitivity = () => {
  if (!R) return head("Scenarios & sensitivity") + suspendedNote();
  const SN = R.sens, m = D.market, A = D.assumptions, r = R.rec;
  const grid = `<div class="tbl-wrap"><table class="heat"><thead><tr><th>WACC \\ g</th>${SN.gs.map(g=>`<th class="n">${p1(g)}</th>`).join("")}</tr></thead><tbody>
    ${SN.waccs.map((w,i) => `<tr><td class="n"><b>${p2(w)}</b></td>${SN.grid[i].map((v,j) => { const u = v/m.price-1, a = Math.min(0.45, Math.abs(u)*0.9);
      const bg = u >= 0 ? `color-mix(in srgb, var(--good) ${a*100}%, transparent)` : `color-mix(in srgb, var(--bad) ${a*100}%, transparent)`;
      return `<td class="n ${i===2&&j===2?"base":""}" style="background:${bg}" title="${sp1(u)} vs price">${f0(v)}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`;
  return head("Scenarios & sensitivity", "How far the value moves when the key assumptions change.") +
  `<div class="panel"><h3>Scenario comparison</h3><div class="tbl-wrap"><table><thead><tr><th></th>${["bear","base","bull"].map(k=>`<th class="n">${A.scenarios[k].label}</th>`).join("")}</tr></thead><tbody>
    <tr><td>Probability</td>${["bear","base","bull"].map(k=>`<td class="n">${p0(A.scenarios[k].probability)}</td>`).join("")}</tr>
    <tr><td>Revenue growth ${A.forecastYears[0]} → ${A.forecastYears[4]}</td>${["bear","base","bull"].map(k=>`<td class="n">${p1(A.scenarios[k].growth[0])} → ${p1(A.scenarios[k].growth[4])}</td>`).join("")}</tr>
    <tr><td>EBITDA margin</td>${["bear","base","bull"].map(k=>`<td class="n">${p1(A.scenarios[k].ebitdaMargin[0])}</td>`).join("")}</tr>
    <tr><td>Sales-to-capital</td>${["bear","base","bull"].map(k=>`<td class="n">${f2(A.scenarios[k].s2c[0])}</td>`).join("")}</tr>
    <tr><td>WACC / terminal g</td>${["bear","base","bull"].map(k=>`<td class="n">${p2(R.dcf[k].wacc)} / ${p1(R.dcf[k].g)}</td>`).join("")}</tr>
    <tr><td>DCF value / share</td>${["bear","base","bull"].map(k=>`<td class="n">${f0(R.dcf[k].vps)}</td>`).join("")}</tr>
    <tr class="total"><td>Blended value / share</td>${["bear","base","bull"].map(k=>`<td class="n">${f0(r.blended[k])}</td>`).join("")}</tr>
    <tr><td>vs price</td>${["bear","base","bull"].map(k=>`<td class="n">${sp1(r.blended[k]/m.price-1)}</td>`).join("")}</tr></tbody></table></div></div>
  <div class="panel"><div class="panel-head"><h3>Tornado · blended value per share (Base)</h3>${legend([["var(--s2)","Downside move"],["var(--s1)","Upside move"]])}</div>
    <div class="tbl-wrap">${tornadoChart(SN.tornado, SN.center)}</div><p class="small muted">Method weights held at the selector result. Centre line = central estimate ${CUR()} ${f0(SN.center)}.</p></div>
  <div class="panel"><h3>DCF value per share · WACC × terminal growth (Base)</h3>${grid}<p class="small muted" style="margin-top:6px">Green = above the market price, red = below; framed cell = base case. Terminal growth barely matters because new capital earns its cost in the terminal period (RONIC = WACC); WACC is the lever.</p></div>`;
};

V.checks = () => {
  const pre = missing.length ? `<div class="panel"><h3>Missing inputs</h3>${suspendedNote()}</div>` : "";
  const list = R ? R.checks : [];
  return head("Validation checks", "Automatic tests for material errors. ERROR checks suspend the recommendation; WARN checks lower the conviction and are listed for the reader.",
    `<button data-act="selftest">Run engine self-test</button>`) + pre +
  (R ? `<div class="panel"><div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Check</th><th>Type</th><th>Result</th><th>Detail</th></tr></thead><tbody>
    ${list.map(c => { const [cl, t] = statusOf(c); return `<tr><td class="mono">${c.id}</td><td>${esc(c.name)}</td><td class="small">${c.severity}</td><td><span class="status ${cl}">${ICON[cl]}${t}</span></td><td class="small">${esc(c.detail)}</td></tr>`; }).join("")}</tbody></table></div></div>` : "") +
  `<div class="panel" id="selftest"><h3>Engine self-test</h3><p class="small muted">Runs this app's JavaScript engine on the original dataset and compares ${PY_REFERENCE.length} key outputs with the independent Python reference engine (engine_ref.py). Your own edits are not affected.</p><div id="selftest-out" style="margin-top:8px"></div></div>`;
};

V.data = () => {
  const log = (D.meta.updateLog || []).map(l => `${fmtTS(l.time)}  ${l.section.padEnd(11)} ${l.action}${l.detail?" – "+l.detail:""}`).join("\n") || "No changes yet in this browser.";
  return head("Import & export", "Update the model from files, value another company, save your dataset, and export the results.") +
  `<div class="panel"><div class="panel-head"><h3>Company being valued: ${esc(CO())} (${esc(TK())})</h3></div>
    <p class="small">The engine is company-agnostic. To value another listed company, start a blank dataset and fill the inputs (or import a filled template); the missing-input list guides you. The Blue Bird dataset is the worked example.</p>
    <div class="row" style="margin-top:8px"><button data-act="newco">Start a new company (blank dataset)</button><button data-act="example">Load example: PT Blue Bird Tbk</button></div></div>
  <div class="grid g2">
    <div class="panel stack"><h3>Update data</h3>
      <p class="small">1. Download the data template (it contains the current figures). 2. Overwrite the values in Excel. 3. Import it here. Sheets: Market, Profile, Financials, Peers, Scenarios, Rules.</p>
